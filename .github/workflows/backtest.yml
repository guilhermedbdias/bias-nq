name: Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - run: |
          git config user.name "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add docs/backtest.json
          git commit -m "backtest" || echo "sem alterações"
          git push
