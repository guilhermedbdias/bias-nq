name: Volatilidade

on:
  schedule:
    - cron: "10 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python vol.py
      - run: |
          git config user.name "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add docs/vol.json
          git commit -m "volatilidade" || echo "sem alterações"
          git pull --rebase
          git push
