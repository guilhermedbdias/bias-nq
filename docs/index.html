<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bias NQ</title>
<style>
:root{--bg:#0f1217;--surf:#171b22;--line:#262c36;--tx:#e8ebf0;--mut:#8b93a1;--bear:#f08a74;--bull:#3ecf95;--track:#1f242d}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--surf:#fff;--line:#dfe2e8;--tx:#14181f;--mut:#6a7280;--bear:#e0654d;--bull:#1f9d6b;--track:#e8ebf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.big{font-size:42px;font-weight:500;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:8px 0 18px}
.meter{position:relative;height:12px;background:var(--track);border-radius:6px}
.meter i{position:absolute;top:0;height:100%;border-radius:6px}
.meter b{position:absolute;left:50%;top:-5px;width:2px;height:22px;background:var(--tx)}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:8px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.row{display:grid;grid-template-columns:140px 1fr 40px;gap:12px;align-items:center;padding:9px 0}
.row .t{position:relative;height:12px;background:var(--track);border-radius:6px}
.row .t:before{content:"";position:absolute;left:50%;top:-3px;width:2px;height:18px;background:var(--line)}
.row .d{position:absolute;top:-1px;width:14px;height:14px;border-radius:50%;margin-left:-7px}
.row output{text-align:right;font-weight:500}
.row small{grid-column:1/-1;color:var(--mut);font-size:12px;margin-top:-6px}
.note{color:var(--mut);font-size:13px}
@media (max-width:480px){.row{grid-template-columns:110px 1fr 36px}.big{font-size:34px}}
</style>
</head>
<body>
<main id="app"><p class="note">A carregar…</p></main>
<script>
function col(v){return v>0?'var(--bull)':v<0?'var(--bear)':'var(--mut)'}
function sg(v){return (v>0?'+':v<0?'−':'')+Math.abs(v)}
fetch('data.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){
  var w=Math.abs(d.total)/2, l=d.total<0?50-w:50, h='';
  h+='<section class="card"><p class="big">'+d.label+'</p><p class="sub">Score '+sg(d.total)+' · valor do modelo '+d.up+'% alta, '+(100-d.up)+'% baixa</p>'+
     '<div class="meter"><i style="left:'+l+'%;width:'+w+'%;background:'+col(d.total)+'"></i><b></b></div>'+
     '<div class="ends"><span>Bearish −100</span><span>0</span><span>+100 Bullish</span></div></section>';
  h+='<section class="card"><h2>Contribuição por módulo</h2>';
  d.modules.forEach(function(m){
    h+='<div class="row"><span>'+m.name+'</span><div class="t"><span class="d" style="left:'+(50+m.score/2)+'%;background:'+col(m.score)+'"></span></div><output style="color:'+col(m.contrib)+'">'+sg(m.contrib)+'</output><small>'+m.note+'</small></div>';
  });
  h+='</section>';
  var L=d.levels||{};
  if(L.p5)h+='<section class="card"><h2>Percentis de hoje (NQ)</h2><p class="note">P5 '+L.p5+' · P25 '+L.p25+' · P50 '+L.p50+' · P75 '+L.p75+' · P95 '+L.p95+'<br>Fecho de ontem '+d.prev+' · preço usado '+d.spot+'</p></section>';
  h+='<p class="note">Atualizado: '+new Date(d.updated).toLocaleString('pt-PT')+'. Ferramenta de leitura, não é aconselhamento financeiro.</p>';
  document.getElementById('app').innerHTML=h;
}).catch(function(){document.getElementById('app').innerHTML='<p class="note">Ainda não há dados. Corre o workflow no separador Actions.</p>'});
</script>
</body>
</html>
