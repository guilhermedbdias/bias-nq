<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NQ Hub · TradingView</title>
<style>
:root{--bg:#0d1014;--surf:#151a21;--surf2:#1b212a;--line:#252c37;--tx:#e8ebf0;--mut:#8b93a1;--hi:#f0b429}
@media (prefers-color-scheme:light){:root{--bg:#f3f4f7;--surf:#fff;--surf2:#f6f7f9;--line:#dfe2e8;--tx:#14181f;--mut:#6a7280;--hi:#b7791f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:17px}.logo span{color:var(--hi)}.goal{color:var(--mut);font-size:13px}
nav{max-width:980px;margin:0 auto;display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto}
nav a{padding:8px 14px;color:var(--mut);text-decoration:none;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
nav a.on{color:var(--tx);border-color:var(--hi);font-weight:600}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
.n{color:var(--mut);font-size:13px}
textarea{width:100%;min-height:200px;font:13px/1.45 ui-monospace,Menlo,monospace;color:var(--tx);background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px}
button{font:inherit;font-weight:600;color:#000;background:var(--hi);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}
td{padding:6px 8px;border-top:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style></head><body>
<header><div class="top"><div class="logo">NQ <span>Hub</span></div><div class="goal">10K até fevereiro · disciplina, plano e journal</div></div>
<nav><a href="index.html#hoje">Hoje</a><a href="index.html#bias">Bias</a><a href="index.html#vol">Volatilidade</a><a href="index.html#amd">AMD</a><a href="index.html#plano">Plano</a><a href="index.html#testes">Testes</a><a href="journal.html">Journal</a><a href="gamma.html">Gamma</a><a href="levels.html">Níveis</a><a class="on" href="tv.html">TradingView</a></nav></header>
<main id="app"><p class="n">A carregar…</p></main>
<script>
function J(u){return fetch(u+'?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return null})}
function T(u){return fetch(u+'?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).catch(function(){return null})}
Promise.all([J('tv_levels.json'),T('tv_levels.txt')]).then(function(x){
  var d=x[0],t=x[1],app=document.getElementById('app');
  if(t)t=t.trim().split(/\r?\n/).join(';');
  if(!d||!t){app.innerHTML='<h1>TradingView</h1><section class="card"><p class="n">Ainda não há dados. Corre o workflow "TV niveis" em Actions (Run workflow).</p></section>';return}
  var h='<h1>Níveis para o TradingView</h1><p class="n">Gamma (QQQ→NQ) e volume profile de 30 e 90 dias (VAH, POC, VAL). Atualizado: '+new Date(d.updated).toLocaleString('pt-PT')+'.</p>';
  h+='<section class="card"><p><button id="cp">Copiar tudo</button> <span class="n" id="ok"></span></p><textarea id="tx" readonly>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea><p class="n">Texto numa só linha. No TradingView: indicador "Níveis" → Definições → Inputs → cola na caixa de texto.</p></section>';
  h+='<section class="card"><table>'+d.levels.map(function(l){return '<tr><td>'+l.name+'</td><td>'+l.price.toLocaleString('pt-PT',{minimumFractionDigits:2})+'</td></tr>'}).join('')+'</table></section>';
  app.innerHTML=h;
  document.getElementById('cp').onclick=function(){var e=document.getElementById('tx');e.select();
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){document.getElementById('ok').textContent='copiado'}).catch(function(){try{document.execCommand('copy');document.getElementById('ok').textContent='copiado'}catch(z){document.getElementById('ok').textContent='seleciona e copia à mão'}})}
});
</script></body></html>
